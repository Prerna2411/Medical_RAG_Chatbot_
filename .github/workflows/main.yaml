name: CI Pipeline (Streamlit + Docker)

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1️ Checkout
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Istall dependencies
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # Test Streamlit App (safer)
    - name: Check Streamlit App Runs
      run: |
        timeout 15s streamlit run app.py --server.headless true || true

    # Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t medical-rag-chatbot .

    # Run Container (Sanity Check)
    - name: Run Docker Container
      run: |
        docker run -d -p 8501:8501 --name test-container medical-rag-chatbot
        sleep 10
        docker ps
        docker logs test-container
        docker stop test-container
